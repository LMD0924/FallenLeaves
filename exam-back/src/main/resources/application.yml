spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exam?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 0924
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Hikari连接池配置（可选，提高性能）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    openai:
      base-url: https://yinli.one/
      api-key: 填写你的密钥
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7
  data:
    redis:
      host: localhost
      port: 6379
      #password: 你的redis密码
      database: 0    #Redis数据库索引，默认使用0索引数据库
      timeout: 3000ms  #连接超时时间
      lettuce:
        pool:
          max-active: 8 #连接池最大连接数（使用负值表示没有限制）
          max-idle: 8 #连接池中的最大空闲连接
          min-idle: 0 #连接池中的最小空闲连接
          max-wait: -1ms #连接池最大阻塞等待时间（使用负值表示没有限制）
#logging:
#  level:
#    org.springframework.ai.chat.client.advisor: debug
#    # 开启MyBatis SQL日志
#    org.example.examback.mapper: debug
# 文件上传目录
file:
  upload-dir: uploads/

# MyBatis配置（必须添加）
mybatis:
  # mapper文件位置
  mapper-locations: classpath:mapper/*.xml
  # 类型别名包扫描
  type-aliases-package: org.example.examback.entity
  # 全局配置
  configuration:
    # 开启驼峰命名映射（数据库下划线 -> 实体类驼峰）
    map-underscore-to-camel-case: true
    # 开启缓存
    cache-enabled: true
    # 开启懒加载
    lazy-loading-enabled: true
    # 打印SQL语句
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080